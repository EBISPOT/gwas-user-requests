name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        For general questions or feedback, please contact **gwas-info@ebi.ac.uk** instead.
        
        For questions about a specific submission, please contact **gwas-subs@ebi.ac.uk** instead.
        
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case, limitation, or problem behind your request.
      placeholder: Tell us what you are trying to do and what is currently difficult or missing.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement you are proposing.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include examples, links, screenshots, or anything else that might help.
    validations:
      required: false
